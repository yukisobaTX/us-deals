name: Morning digest
# 毎朝 7 時台(CT)に新着のまとめを Issue で送る。@ で GitHub の通知メールが届く。
# 夏時間(12:41 UTC = 7:41 CDT)と冬時間(13:41 UTC = 7:41 CST)の2つで起動し、
# スクリプトが CT の 7 時台のときだけ送る。
on:
  schedule:
    - cron: "41 12 * * *"
    - cron: "41 13 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "時刻を無視して今すぐ送る"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: data-write
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SITE_URL: ${{ vars.SITE_URL || 'https://us-deals.10baki-c03.workers.dev' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch RSS (latest before digest)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 scripts/fetch_deals.py || true
      - name: Send digest
        run: python3 scripts/daily_digest.py ${{ inputs.force && '--force' || '' }}
      - name: Commit
        run: |
          git config user.name "deals-bot"
          git config user.email "deals-bot@users.noreply.github.com"
          git add public/data/
          git diff --cached --quiet && exit 0
          git commit -m "Digest $(date -u +%Y-%m-%d)"
          git pull --rebase -X theirs origin main
          git push
