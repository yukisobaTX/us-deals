name: Evening digest
# 前日の 18 時ごろ(CT)に、翌日分のまとめを1通だけ Gmail で送る(2026-10-31 本人指定。以前は朝 7:15)。
# 夏時間(22:53 UTC = 17:53 CDT)と冬時間(23:53 UTC = 17:53 CST)の2つで起動し、
# スクリプトが CT の 17〜18 時台のときだけ送る(1日1通。2回目は「送信済み」で止まる)。
on:
  schedule:
    - cron: "53 22 * * *"
    - cron: "53 23 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "時刻を無視して今すぐ送る"
        type: boolean
        default: false
      test:
        description: "テスト送信(自分のアドレスだけ・記録は更新しない)"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  id-token: write   # ポータル(my-portal)へのプッシュ通知の認証(OIDC)

concurrency:
  group: data-write
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SITE_URL: ${{ vars.SITE_URL || 'https://us-deals.10baki-c03.workers.dev' }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      GMAIL_USER: 10baki.c03@gmail.com
      MAIL_TO: pinkpokepoke@gmail.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch RSS (latest before digest)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 scripts/fetch_deals.py || true
      - name: Send digest
        run: python3 scripts/daily_digest.py ${{ inputs.test && '--test' || (inputs.force && '--force' || '') }}
      - name: Commit
        run: |
          git config user.name "deals-bot"
          git config user.email "deals-bot@users.noreply.github.com"
          git add public/data/
          git diff --cached --quiet && exit 0
          git commit -m "Digest $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            echo "push 失敗 ($i/3) → $((i*20))秒後に再試行"; sleep $((i*20))
          done
          exit 1
