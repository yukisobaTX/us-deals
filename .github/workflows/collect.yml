name: Collect deals
# 毎時 RSS を取得して public/data/deals.json を更新し、無料でもらえる新着があれば即通知(AI なし)
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: data-write
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test classifier
        run: python3 tests/test_classify.py
      - name: Fetch RSS
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 scripts/fetch_deals.py
      - name: Freebie alert
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SITE_URL: ${{ vars.SITE_URL || 'https://us-deals.10baki-c03.workers.dev' }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_USER: 10baki.c03@gmail.com
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python3 scripts/freebie_alert.py
      - name: Commit
        run: |
          git config user.name "deals-bot"
          git config user.email "deals-bot@users.noreply.github.com"
          git add public/data/
          git diff --cached --quiet && exit 0
          git commit -m "Deals $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase -X theirs origin main
          git push
